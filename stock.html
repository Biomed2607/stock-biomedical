<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stock — Stock biomédical</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="stock-only-body">
  <header class="site-header stock-centered-header">
    <div class="brand">
      <img
        src="hopital_prive_drome_ardeche_logo.jpeg"
        alt="Hôpital privé Drôme Ardèche"
        class="brand-logo"
      />

      <div>
        <h1>Stock</h1>
        <p>Scannez un QR code puis ajoutez ou retirez du stock</p>
      </div>
    </div>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="stock.html">Stock</a>
      <a href="gestion-stock.html">Gestion du stock</a>
    </nav>
  </header>

  <main class="stock-page">
    <section class="stock-terminal">
      <div class="stock-terminal-header">
        <h2>Gestion de stock</h2>
        <p>Scannez ou saisissez une référence</p>
      </div>

      <div class="stock-terminal-body">
        <div class="scan-input-wrapper">
          <input
            id="qrSearch"
            class="scan-input-main"
            type="text"
            placeholder="Scanner ou saisir une référence..."
            autocomplete="off"
            autofocus
          />
          <span class="scan-input-icon">📷</span>
        </div>

        <div class="camera-row">
          <button id="startScannerBtn" class="camera-main-btn" type="button">
            📸 Ouvrir caméra
          </button>

          <button id="stopScannerBtn" class="camera-main-btn danger" type="button">
            ✕ Fermer caméra
          </button>
        </div>

        <div id="qrReader" class="qr-reader-box"></div>

        <div class="current-item-card">
          <div class="current-label">Article scanné</div>
          <div id="currentCode" class="current-code empty">Aucun article</div>
        </div>

        <div class="stock-counter">
          <button id="removeStockBtn" class="stock-round-btn minus" type="button">−</button>

          <div class="pending-box">
            <span>Quantité</span>
            <strong id="pendingQuantity">0</strong>
          </div>

          <button id="addStockBtn" class="stock-round-btn plus" type="button">+</button>
        </div>

        <button id="validateStockBtn" class="validate-stock-btn" type="button">
          Valider le mouvement
        </button>

        <div id="stockNotification" class="notification" style="display: none;"></div>
      </div>
    </section>
  </main>

  <script type="module" src="index.js?v=70"></script>
</body>
</html>
