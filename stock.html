<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stock — Stock Biomédical</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Scanner QR code -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="stock-modern-body">
  <main class="stock-modern-page">
    <section class="stock-modern-card">
      <header class="stock-modern-header">
        <h1>Stock</h1>
        <p>Scanner ou saisir un QR code pour ajouter ou retirer un article</p>
      </header>

      <div class="stock-scan-zone">
        <input
          id="qrSearch"
          class="stock-modern-input"
          type="text"
          placeholder="Scanner ou saisir"
          autocomplete="off"
          autofocus
        />

        <div class="stock-camera-actions">
          <button id="startScannerBtn" class="camera-btn open" type="button">
            Ouvrir caméra
          </button>

          <button id="stopScannerBtn" class="camera-btn close" type="button">
            Fermer caméra
          </button>
        </div>

        <div id="qrReader" class="stock-qr-reader"></div>
      </div>

      <div class="stock-actions-modern">
        <button id="removeStockBtn" class="stock-round-btn remove" type="button" title="Retirer un article">
          −
        </button>

        <button id="addStockBtn" class="stock-round-btn add" type="button" title="Ajouter un article">
          +
        </button>
      </div>

      <div id="stockInfo" class="stock-modern-info hidden">
        Aucun article sélectionné.
      </div>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
