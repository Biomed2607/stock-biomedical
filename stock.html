<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Stock</title>
    <link rel="stylesheet" href="stock.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="stock-container">
        <!-- En-tête -->
        <div class="header">
            <h1>Gestion de Stock</h1>
            <p class="subtitle">Scannez ou saisissez un code</p>
        </div>

        <!-- Zone de scan -->
        <div class="scanner-section">
            <div class="scanner-wrapper">
                <input 
                    type="text" 
                    class="scan-input" 
                    id="scanInput" 
                    placeholder="Scanner ou saisir un code..."
                    autocomplete="off"
                    autofocus
                />
                <span class="scan-icon">📷</span>
            </div>

            <!-- Boutons caméra -->
            <div class="camera-toggle">
                <button class="btn-camera" id="startCameraBtn">
                    <span>📸</span> Ouvrir caméra
                </button>
                <button class="btn-camera stop" id="stopCameraBtn" style="display: none;">
                    <span>✕</span> Fermer caméra
                </button>
            </div>

            <!-- Lecteur QR -->
            <div class="qr-reader" id="qrReader"></div>
        </div>

        <!-- Actions -->
        <div class="actions-section">
            <!-- Article scanné -->
            <div class="current-item">
                <div class="label">Article scanné</div>
                <div class="code empty" id="currentCode">Aucun article</div>
            </div>

            <!-- Boutons + et - -->
            <div class="btn-group">
                <button class="btn-action btn-remove" id="removeBtn">
                    <span>−</span>
                </button>
                <button class="btn-action btn-add" id="addBtn">
                    <span>+</span>
                </button>
            </div>

            <!-- Message de confirmation -->
            <div class="notification" id="notification" style="display: none;"></div>
        </div>
    </div>

    <script src="stock.js"></script>
</body>
</html>
