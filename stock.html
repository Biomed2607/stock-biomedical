<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stock — Stock Biomédical</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="stock-app-body">
  <div class="stock-container">
    <div class="stock-header">
      <h1>Gestion de Stock</h1>
      <p class="stock-subtitle">Scannez ou saisissez un code</p>
    </div>

    <div class="scanner-section">
      <div class="scanner-wrapper">
        <input
          type="text"
          class="scan-input"
          id="qrSearch"
          placeholder="Scanner ou saisir un code..."
          autocomplete="off"
          autofocus
        />
        <span class="scan-icon">📷</span>
      </div>

      <div class="camera-toggle">
        <button class="btn-camera" id="startScannerBtn" type="button">
          <span>📸</span> Ouvrir caméra
        </button>

        <button class="btn-camera stop" id="stopScannerBtn" type="button">
          <span>✕</span> Fermer caméra
        </button>
      </div>

      <div class="qr-reader" id="qrReader"></div>
    </div>

    <div class="actions-section">
      <div class="current-item">
        <div class="label">Article scanné</div>
        <div class="code empty" id="currentCode">Aucun article</div>
      </div>

      <div class="btn-group">
        <button class="btn-action btn-remove" id="removeStockBtn" type="button">
          <span>−</span>
        </button>

        <button class="btn-action btn-add" id="addStockBtn" type="button">
          <span>+</span>
        </button>
      </div>

      <div class="notification" id="stockNotification"></div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
