<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock — Stock Biomédical</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Scan QR code avec caméra -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="stock-minimal-body">
  <main class="stock-minimal-page">
    <input
      id="qrSearch"
      class="stock-scan-input"
      type="text"
      placeholder="scanner ou saisir"
      autocomplete="off"
      autofocus
    />

    <div id="qrReader" class="minimal-qr-reader"></div>

    <div class="stock-minimal-actions">
      <button id="addStockBtn" class="stock-symbol-btn plus" type="button">+</button>
      <button id="removeStockBtn" class="stock-symbol-btn minus" type="button">−</button>
    </div>

    <p id="stockInfo" class="stock-info hidden"></p>

    <button id="startScannerBtn" class="hidden" type="button">Ouvrir caméra</button>
    <button id="stopScannerBtn" class="hidden" type="button">Fermer caméra</button>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
