<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stock — Stock biomédical</title>

  <link rel="stylesheet" href="styles.css?v=95" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Stock Bio" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script src="pwa.js?v=95" defer></script>
</head>

<body class="stock-only-body">
<header class="site-header"><div class="brand">
    <img src="hopital_prive_drome_ardeche_logo.jpeg" alt="Hôpital privé Drôme Ardèche" class="brand-logo" />
    <div><h1>Stock</h1><p>Scanner ou saisir une référence, puis enregistrer le mouvement.</p></div>
  </div></header>
  <nav class="quick-nav" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="stock.html" aria-current="page">Stock</a><a href="ajouter-consommable.html">Ajouter</a><a href="gestion-stock.html">Gestion</a></nav>
  <div class="app-toolbar"><span id="connectionStatus" role="status"></span>
  </div>
  <main class="stock-page">
    <section class="stock-terminal">
      <div class="stock-terminal-header">
        <h2>Gestion de stock</h2>
        <p>Scannez ou saisissez une référence</p>
      </div>

      <div class="stock-terminal-body">
        <label class="manual-ref-label" for="qrSearch">Référence ou code de l’article</label>
        <div class="manual-ref-row">
        <div class="scan-input-wrapper">
          <input
            id="qrSearch"
            class="scan-input-main"
            type="text"
            placeholder="Scanner ou saisir une référence..."
            autocomplete="off"
            enterkeyhint="search"
            autocapitalize="characters"
          />
          <span class="scan-input-icon">📷</span>
        </div>
        </div>
        <p class="scan-help">Référence saisie : Scanner la valide. Champ vide : Scanner ouvre la caméra.</p>
        <div id="matchChoices" aria-live="polite"></div>
        <div class="camera-row">
          <button id="startScannerBtn" class="camera-main-btn" type="button">
            📸 Scanner
          </button>

          <button id="stopScannerBtn" class="camera-main-btn danger" type="button">
            ✕ Fermer caméra
          </button>
        </div>

        <div id="qrReader" class="qr-reader-box"></div>

        <div class="current-item-card">
          <div class="current-label">Article scanné</div>
          <div id="currentCode" class="current-code empty">Aucun article</div>
        </div>

        <div class="stock-counter">
          <button id="removeStockBtn" class="stock-round-btn minus" type="button">−</button>

          <div class="pending-box">
            <span>Quantité</span>
            <strong id="pendingQuantity">0</strong>
          </div>

          <button id="addStockBtn" class="stock-round-btn plus" type="button">+</button>
        </div>

        <button id="validateStockBtn" class="validate-stock-btn" type="button">
          Valider le mouvement
        </button>

        <div id="stockNotification" class="notification" role="status" style="display: none;"></div>
        <div id="alertResult" role="status" hidden></div>
        <button id="retryAlertBtn" class="btn warning" type="button" hidden>Relancer uniquement l’alerte email</button>
        <div class="stock-data-footer">
          <p id="dataStatus" role="status">Chargement du stock…</p>
          <button id="refreshStockBtn" class="btn secondary" type="button">Actualiser le stock</button>
        </div>
      </div>
    </section>
  </main>

<button id="backToTopBtn" class="back-to-top" type="button" hidden aria-label="Revenir en haut de la page">↑ Haut</button>
  <script type="module" src="index.js?v=93"></script>
</body>
</html>
